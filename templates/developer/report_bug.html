{% extends "base.html" %}

{% block title %}Report Bug - AI-SDLC{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-bug"></i> Report a Bug</h5>
            </div>

            <div class="card-body p-4">

                <p class="text-muted">On task: <strong>{{ task.title }}</strong></p>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Bug Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4"></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Severity</label>
                        <select name="severity" class="form-select">
                            {% for s in severities %}
                            <option value="{{ s }}" {% if s == "Medium" %}selected{% endif %}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('developer.task_details', task_id=task.id) }}"
                           class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Submit Bug</button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
