{% extends "base.html" %}

{% block title %}{{ code }} - AI-SDLC{% endblock %}

{% block content %}

<div class="d-flex justify-content-center">
    <div class="col-md-6 text-center py-5">
        <i class="bi bi-hourglass-split text-warning" style="font-size:3rem;"></i>
        <h2 class="fw-bold mt-3">{{ code }}</h2>
        <p class="text-muted">{{ message }}</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-2">Back to Login</a>
    </div>
</div>

{% endblock %}
