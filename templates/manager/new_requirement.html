{% extends "base.html" %}

{% block title %}Add Requirement - AI-SDLC{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Add Requirement</h4>
            </div>

            <div class="card-body p-4">

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                {% if not projects %}
                <div class="alert alert-warning">
                    No approved/active projects available. Approve a project first.
                </div>
                {% endif %}

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Project</label>
                        <select name="project_id" class="form-select" required {% if not projects %}disabled{% endif %}>
                            <option value="" selected disabled>Select project</option>
                            {% for p in projects %}
                            <option value="{{ p.id }}"
                                {% if form_values and form_values.project_id|string == p.id|string %}selected{% endif %}>
                                {{ p.project_name }} ({{ p.status }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control"
                               value="{{ form_values.title if form_values else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4">{{ form_values.description if form_values else '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            {% for p in priorities %}
                            <option value="{{ p }}" {% if p == "Medium" %}selected{% endif %}>{{ p }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('requirement.requirements') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary" {% if not projects %}disabled{% endif %}>
                            Add Requirement
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
