<!DOCTYPE html>
<html>

<head>

    <title>Reset Password - AI SDLC</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="container">

    <div class="left">

        <h1 class="page-title">Reset Password</h1>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>New Password</label>

            <div class="password-box">
                <input type="password" id="password" name="password"
                       placeholder="Enter new password" minlength="8" required>
                <i id="togglePassword" class="bi bi-eye-fill eye-icon"
                   onclick="togglePassword('password','togglePassword')"></i>
            </div>

            <label>Confirm New Password</label>

            <div class="password-box">
                <input type="password" id="confirm_password" name="confirm_password"
                       placeholder="Confirm new password" minlength="8" required>
                <i id="toggleConfirm" class="bi bi-eye-fill eye-icon"
                   onclick="togglePassword('confirm_password','toggleConfirm')"></i>
            </div>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <p class="bottom-text">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </p>

    </div>

    <div class="right">

        <img src="{{ url_for('static', filename='images/logo-light.svg') }}"
             alt="AI-SDLC Logo"
             style="width:160px;">

        <h2>Choose a strong password</h2>

        <p>
            Use at least 8 characters. Avoid reusing passwords from other sites.
        </p>

    </div>

</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>

</html>
