<!DOCTYPE html>
<html>

<head>

    <title>Login - AI SDLC</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="container">

    <div class="left">

        <h1 class="page-title">Login</h1>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>Username or Email</label>

            <input
                type="text"
                name="identifier"
                placeholder="Enter Username or Email"
                required>

            <label>Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required>

                <i
                    id="togglePassword"
                    class="bi bi-eye-fill eye-icon"
                    onclick="togglePassword('password','togglePassword')">
                </i>

            </div>

            <button type="submit">
                Login
            </button>

            <p class="forgot-password">
                <a href="{{ url_for('auth.forgot_password') }}">Forgot Password?</a>
            </p>

        </form>

        <p class="bottom-text">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Sign Up
            </a>

        </p>

    </div>

    <div class="right">

        <img src="{{ url_for('static', filename='images/logo-light.svg') }}"
             alt="AI-SDLC Logo"
             style="width:160px;">

        <h2>Welcome Back!</h2>

        <p>
            Login to continue managing your Software Development Life Cycle.
        </p>

    </div>

</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>

</html>
